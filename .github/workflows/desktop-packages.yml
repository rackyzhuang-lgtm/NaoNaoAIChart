name: Desktop packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows installers
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      npm_config_registry: https://registry.npmmirror.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build renderer and main process
        run: pnpm run build

      - name: Package Windows installers
        run: pnpm exec electron-builder build --publish never --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: naonaoai-windows-installers
          path: |
            release/build/*.exe
            release/build/*.yml
            release/build/*.blockmap
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS installers
    runs-on: macos-14
    timeout-minutes: 60
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_DOWNLOAD_OVERRIDE_URL: https://github.com/electron-userland/electron-builder-binaries/releases/download/dmg-builder%401.2.0
      npm_config_registry: https://registry.npmmirror.com
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build renderer and main process
        run: pnpm run build

      - name: Package macOS installers
        run: pnpm exec electron-builder build --publish never --mac dmg zip

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: naonaoai-macos-installers
          path: |
            release/build/*.dmg
            release/build/*.zip
            release/build/*.yml
            release/build/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./release/app/package.json').version")"
          if [[ "$TAG_NAME" != "v$package_version" ]]; then
            echo "Tag $TAG_NAME does not match packaged app version $package_version" >&2
            exit 1
          fi

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: naonaoai-*-installers
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -d '' assets < <(
            find release-assets -type f \(
              -name '*.exe' -o -name '*.dmg' -o -name '*.zip'
            \) -print0
          )
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo 'No release installers were downloaded' >&2
            exit 1
          fi
          gh release create "$TAG_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "NaoNaoAI Chat $TAG_NAME"
